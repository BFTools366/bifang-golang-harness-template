auth.token.expired: Access token has expired
auth.token.revoked: Access token has been revoked
auth.token.malformed: Access token cannot be parsed
auth.token.wrong.type: Access token type mismatch
auth.token.sign.failed: Failed to sign access token
auth.refresh.invalid: Invalid refresh token
auth.refresh.expired: Refresh token has expired
auth.credentials.invalid: Incorrect account or credential
auth.account.disabled: The account has been disabled
auth.signing.key.missing: Server signing key is missing
auth.issuer.mismatch: Token issuer does not match this service

