# English error messages. Keys are the stable error codes defined in apperr.
common.bad.request: Invalid request parameters
common.unauthorized: Authentication required
common.forbidden: You are not allowed to perform this operation
common.not.found: The requested resource does not exist
common.conflict: The requested resource conflicts
common.unprocessable: The request cannot be accepted by business rules
common.too.many.requests: Too many requests, please try again later
common.internal.error: Internal server error
common.route.not.found: The requested endpoint does not exist
common.method.not.allowed: The request method is not supported
common.unsupported.media.type: Unsupported request content type
common.payload.too.large: Request payload is too large

